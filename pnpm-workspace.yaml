packages:
  - "packages/*"

# Every external dependency version lives here, one version each.
# Packages reference it with "catalog:".
catalog:
  "@eslint/js": ^10.0.1
  "@sveltejs/adapter-static": ^4.0.0
  "@sveltejs/kit": ^3.0.0
  "@sveltejs/vite-plugin-svelte": ^7.2.0
  '@threlte/core': ^8.6.1
  '@threlte/extras': ^9.22.0
  "@threlte/test": ^2.1.0
  "@types/node": ^24
  '@types/three': ^0.186.0
  "@vitest/browser-playwright": ^5.0.3
  eslint: ^10.4.1
  eslint-config-prettier: ^10.1.8
  eslint-plugin-svelte: ^3.19.0
  globals: ^17.6.0
  playwright: ^1.63.0
  prettier: ^3.8.3
  prettier-plugin-svelte: ^4.1.0
  runic-svelte-fsm: ^2.0.0
  svelte: ^5.57.1
  svelte-check: ^4.6.0
  three: ^0.186.1
  typescript: ^6.0.3
  typescript-eslint: ^8.60.1
  vite: ^8.3.0
  vitest: ^5.0.3
  vitest-browser-svelte: ^3.1.0

# `pnpm add` refuses versions not in the catalog.
catalogMode: strict
# Drop catalog entries nobody references.
catalogPrune: true

strictPeerDependencies: true
allowBuilds:
  esbuild: true
